# Generate the skeleton yourself:
#   kubectl create cronjob backup --image=busybox:1.36 \
#     --schedule="0 2 * * *" --dry-run=client -o yaml -- /bin/sh -c 'echo hi'
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 2 * * *"          # 02:00 daily
  timeZone: "Etc/UTC"            # ⚠️ WITHOUT this, schedules run in UTC —
                                 # your "2am backup" may run mid-afternoon.
                                 # (spec.timeZone requires Kubernetes v1.27+)
  concurrencyPolicy: Forbid      # Allow | Forbid | Replace
                                 # ⚠️ `Allow` is the DEFAULT and is usually
                                 # wrong for backups — overlapping runs writing
                                 # to the same destination can corrupt data.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3      # keep failures around long enough to read
  startingDeadlineSeconds: 300   # how late a missed run may still start
  suspend: false                 # ⚠️ true = silently not running. Audit with:
                                 #   kubectl get cronjobs -A
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo 'backing up'; sleep 10"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi

# Cron syntax:
#   ┌ minute  ┌ hour  ┌ day of month  ┌ month  ┌ day of week (0=Sunday)
#   0         2       *               *        *      → 02:00 daily
#   */15      *       *               *        *      → every 15 minutes
#   0         9       *               *        1-5    → 09:00 Mon-Fri
#
# Trigger a run right now, using the exact same template:
#   kubectl create job backup-manual-001 --from=cronjob/backup
#
# Pause it (during an incident, say):
#   kubectl patch cronjob backup -p '{"spec":{"suspend":true}}'

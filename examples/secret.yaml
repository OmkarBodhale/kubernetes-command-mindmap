# Generate the skeleton yourself:
#   kubectl create secret generic db-secret \
#     --from-literal=username=admin --dry-run=client -o yaml
#
# ⚠️ DO NOT COMMIT A REAL SECRET TO GIT.
# base64 is an ENCODING, not encryption — the value below is readable by
# anyone with the file. Use Sealed Secrets, SOPS, or the External Secrets
# Operator for anything real. This file is a shape reference only.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque                     # the default; app credentials and API keys
stringData:                      # stringData takes PLAIN text — Kubernetes
  username: admin                # encodes it for you. Easier and less error-prone
  password: change-me            # than hand-encoding into `data:`.

# Other types you'll meet:
#   kubernetes.io/tls                 tls.crt + tls.key      → Ingress TLS
#   kubernetes.io/dockerconfigjson    .dockerconfigjson      → private registries
#
# Create those with the purpose-built commands, not by hand:
#   kubectl create secret tls web-tls --cert=./tls.crt --key=./tls.key
#   kubectl create secret docker-registry regcred \
#     --docker-server=<registry> --docker-username=<u> --docker-password=<p>
#
# ⚠️ Writing values with `echo` adds a trailing newline that becomes part of
# the credential. Use `printf` instead — it's a genuinely nasty bug to find.
